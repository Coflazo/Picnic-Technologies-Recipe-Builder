[project]
name = "picnic-recipe-builder"
version = "1.0.0"
description = "AI-powered recipe-to-shopping-list for Picnic Technologies"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "spacy>=3.7.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
